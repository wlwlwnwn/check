<title>안과 키워드 모바일 SERP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: 한 줄 툴바 + 그룹별 키워드 링크 그리드 */
:root{
  --bg:#f6f8f6; --surface:#ffffff; --fg:#17201b; --muted:#5d6b63; --line:#dde4df;
  --accent:#03a94d; --accent-ink:#ffffff; --chip:#e9f5ee;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#1a211d; --fg:#e7ede9; --muted:#9aa8a0; --line:#2b3530;
  --accent:#2fd179; --accent-ink:#0b1a11; --chip:#1f3027; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#1a211d; --fg:#e7ede9; --muted:#9aa8a0; --line:#2b3530;
  --accent:#2fd179; --accent-ink:#0b1a11; --chip:#1f3027; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:880px;margin:0 auto;padding-block:28px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:0 0 4px;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
button{font:inherit;font-weight:600;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{font-size:13px;color:var(--muted);min-height:20px;margin-bottom:16px}
section{margin-top:22px}
h2{font-size:13px;letter-spacing:.04em;color:var(--muted);margin:0 0 10px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
h2 button{padding:4px 10px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.grid a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--fg);text-decoration:none;min-width:0}
.grid a:hover{border-color:var(--accent)}
.grid a span{overflow-wrap:anywhere}
.grid a i{font-style:normal;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.grid a.done{background:var(--chip)}
textarea{position:absolute;left:-9999px}
</style>

<div class="wrap">
  <h1>안과 키워드 모바일 검색 링크</h1>
  <p class="sub">네이버 모바일 통합검색 · 직전 검색어 등 추적값 제거 · 총 <b id="total"></b>개</p>
  <div class="bar">
    <button class="primary" id="openAll" type="button">전체 새 탭으로 열기</button>
    <button id="copyAll" type="button">전체 URL 복사</button>
  </div>
  <div class="msg" id="msg" role="status"></div>
  <div id="groups"></div>
  <textarea id="buf" aria-hidden="true"></textarea>
</div>

<script>
const all=["강남안과","황반변성","황반변성 치료","황반변성 증상","황반변성검사","황반변성수술","황반변성영양제","황반변성원인","황반변성주사","황반변성치료제","당뇨망막병증","망막박리","망막박리 증상","망막박리수술","망막박리치료","망막전막","망막전막증","망막전막수술","백내장수술","백내장초기증상","강남백내장","백내장렌즈","백내장병원","백내장안과","백내장초기","백내장치료","백내장증상"];
const url=k=>"https://m.search.naver.com/search.naver?where=m&query="+encodeURIComponent(k);
document.getElementById("total").textContent=all.length;
const msg=t=>document.getElementById("msg").textContent=t;
let n=0;const root=document.getElementById("groups");
{
  const g=document.createElement("div");g.className="grid";root.appendChild(g);
  all.forEach(k=>{n++;const a=document.createElement("a");a.href=url(k);a.target="_blank";a.rel="noopener";
    a.dataset.k=k;a.innerHTML=`<span>${k}</span><i>${String(n).padStart(2,"0")}</i>`;
    a.addEventListener("click",()=>a.classList.add("done"));g.appendChild(a);});
}
function openList(list){
  let ok=0;
  list.forEach(k=>{let w=null;try{w=window.open(url(k),"_blank","noopener");}catch(e){}
    if(w!==null||ok>0)ok++;});
  const opened=list.filter(()=>true);
  if(ok===0){msg("이 창에서는 한 번에 열기가 막혀 있어요. 'URL 복사' 후 붙여넣거나, 다운로드한 HTML 파일을 크롬에서 열어 팝업을 허용해 주세요.");return;}
  document.querySelectorAll(".grid a").forEach(a=>{if(list.includes(a.dataset.k))a.classList.add("done")});
  msg(list.length+"개 탭을 열었어요. 일부만 열렸다면 주소창 오른쪽의 팝업 차단 아이콘에서 '항상 허용'을 눌러 주세요.");
}
document.getElementById("openAll").onclick=()=>openList(all);
document.getElementById("copyAll").onclick=async()=>{
  const t=all.map(url).join("\n");
  try{await navigator.clipboard.writeText(t);msg(all.length+"개 URL을 복사했어요.");}
  catch(e){const b=document.getElementById("buf");b.value=t;b.select();
    try{document.execCommand("copy");msg(all.length+"개 URL을 복사했어요.");}catch(_){msg("복사가 막혔어요. 링크를 하나씩 열어 주세요.");}}
};
</script>
